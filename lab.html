<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المختبر الدراسي المتقدم | Anatomy Atlas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <link rel="stylesheet" href="atlas.css">
</head>
<body>

<div class="header-wrapper"><!-- نفس الهيدر الموجود في باقي الصفحات --></div>

<main class="container py-4">
    <!-- قاموس الأجزاء التشريحية -->
    <div class="row g-4 mb-5">
        <div class="col-lg-7">
            <div class="lab-card shadow">
                <h3 class="text-info mb-4">📖 قاموس الأجزاء التشريحية</h3>
                <input type="text" id="anatomySearch" class="form-control bg-dark text-white border-secondary mb-3" placeholder="ابحث عن عضو...">
                <div class="table-responsive">
                    <table class="table table-dark table-hover" id="anatomyTable">
                        <thead><tr><th>العضو</th><th>الجهاز</th><th>الوظيفة</th></tr></thead>
                        <tbody id="dictionaryTableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="lab-card shadow">
                <h3 class="text-info mb-4">⚖️ حاسبة BMI</h3>
                <!-- ... حاسبة BMI كما هي ... -->
            </div>
        </div>
    </div>

    <!-- لوحة تقدم الأجهزة -->
    <h3 class="text-info mb-4">📊 تقدمي في أجهزة الجسم</h3>
    <div class="row g-4" id="systemsProgressContainer"></div>
</main>

<script>
    // الأجهزة المعروفة (للتقدم)
    const SYSTEMS = [
        { id: 'skeletal', name: 'الهيكل العظمي', page: 'skeletal.html' },
        { id: 'muscular', name: 'الجهاز العضلي', page: 'muscular.html' },
        { id: 'circulatory', name: 'الجهاز الدوري', page: 'circulatory.html' },
        { id: 'digestive', name: 'الجهاز الهضمي', page: 'digestive.html' },
        { id: 'nervous', name: 'الجهاز العصبي', page: 'nervous.html' }
    ];

    // دالة لقراءة جميع قوائم الأعضاء من localStorage
    function loadAllOrgansForDictionary() {
        let allOrgans = [];
        for (let sys of SYSTEMS) {
            let key = `organsList_${sys.id}`;
            let stored = localStorage.getItem(key);
            if (stored) {
                let organs = JSON.parse(stored);
                for (let organ of organs) {
                    allOrgans.push({
                        name: organ.name,
                        system: sys.id,
                        function: organ.details ? organ.details.substring(0, 100) + '...' : 'لا توجد معلومات',
                        systemName: sys.name
                    });
                }
            }
        }
        // إذا لم يتم العثور على أي بيانات (أول استخدام)، أظهر رسالة توجيهية
        if (allOrgans.length === 0) {
            allOrgans.push({
                name: "⚠️ لم يتم العثور على بيانات",
                system: "none",
                function: "يرجى زيارة صفحات الأجهزة أولاً لتسجيل بياناتها.",
                systemName: "تنبيه"
            });
        }
        return allOrgans;
    }

    // بناء جدول البحث
    function buildDictionaryTable() {
        let allOrgans = loadAllOrgansForDictionary();
        let tbody = document.getElementById('dictionaryTableBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        for (let organ of allOrgans) {
            let row = tbody.insertRow();
            row.setAttribute('data-system', organ.system);
            row.classList.add('clickable-row');
            let cell1 = row.insertCell(0);
            let cell2 = row.insertCell(1);
            let cell3 = row.insertCell(2);
            cell1.innerText = organ.name;
            cell2.innerText = organ.systemName;
            cell3.innerText = organ.function;
            // عند النقر على الصف، انتقل إلى صفحة الجهاز المعني
            if (organ.system !== 'none') {
                row.addEventListener('click', () => {
                    window.location.href = `${organ.system}.html`;
                });
            } else {
                row.style.cursor = 'default';
                row.style.opacity = '0.7';
            }
        }
    }

    // دالة فلترة البحث
    function filterDictionary() {
        let input = document.getElementById('anatomySearch').value.toUpperCase();
        let rows = document.querySelectorAll('#dictionaryTableBody tr');
        for (let row of rows) {
            let cells = row.getElementsByTagName('td');
            if (cells.length) {
                let text = cells[0].innerText.toUpperCase();
                row.style.display = text.includes(input) ? '' : 'none';
            }
        }
    }

    // دوال التقدم (مشابهة للسابق)
    function getStudiedOrgans(systemId) {
        let key = `studiedOrgans_${systemId}`;
        let stored = localStorage.getItem(key);
        return stored ? JSON.parse(stored) : [];
    }

    function renderProgressCards() {
        const container = document.getElementById('systemsProgressContainer');
        if (!container) return;
        container.innerHTML = '';
        for (let sys of SYSTEMS) {
            let totalKey = `totalOrgans_${sys.id}`;
            let total = localStorage.getItem(totalKey);
            if (!total) total = 0;
            else total = parseInt(total);
            let studied = getStudiedOrgans(sys.id);
            let completedCount = studied.length;
            let percent = total > 0 ? (completedCount / total) * 100 : 0;
            let card = document.createElement('div');
            card.className = 'col-md-6 col-lg-4';
            card.innerHTML = `
                <div class="system-card">
                    <div class="system-title">${sys.name}</div>
                    <div class="progress-bar-container"><div class="progress-fill" style="width:${percent}%"></div></div>
                    <div class="stat-text">📌 الإنجاز: ${completedCount} من ${total} عضواً (${Math.round(percent)}%)</div>
                    <div class="d-flex gap-2 mt-3">
                        <button class="btn btn-outline-info btn-sm-custom" onclick="exportSystemPDF('${sys.id}')">📄 طباعة تقرير الجهاز</button>
                        <button class="btn btn-outline-warning btn-sm-custom" onclick="goToQuiz('${sys.id}')">🎯 إعداد اختبار AI</button>
                    </div>
                </div>
            `;
            container.appendChild(card);
        }
    }

    // وظائف تصدير PDF و quiz (يمكن إضافتها لاحقاً)
    window.exportSystemPDF = async (systemId) => { alert('سيتم تفعيل PDF لاحقاً'); };
    window.goToQuiz = (systemId) => { window.location.href = `quiz-setup.html?system=${systemId}`; };

    // التهيئة
    buildDictionaryTable();
    renderProgressCards();
    document.getElementById('anatomySearch')?.addEventListener('keyup', filterDictionary);
    // تحديث تلقائي كل 3 ثوانٍ (لتحديث التقدم إذا تغير من صفحات أخرى)
    setInterval(() => renderProgressCards(), 3000);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
