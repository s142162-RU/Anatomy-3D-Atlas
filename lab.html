ر<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المختبر الدراسي المتقدم | Anatomy Atlas</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    
    <link rel="stylesheet" href="atlas.css">
</head>
<body>

<div class="header-wrapper"><!-- نفس الهيدر الموجود سابقاً - للاختصار لم أكرره --></div>

<main class="container py-4">
    <!-- ========= 1. قاموس الأجزاء + BMI (مع Pagination) ========= -->
    <div class="row g-4 mb-5">
        <div class="col-lg-7">
            <div class="lab-card shadow">
                <h3 class="text-info mb-4">📖 قاموس الأجزاء التشريحية</h3>
                <input type="text" id="anatomySearch" class="form-control bg-dark text-white border-secondary mb-3" placeholder="ابحث عن عضو...">
                <div class="table-responsive">
                    <table class="table table-dark table-hover" id="anatomyTable">
                        <thead>
                            <tr><th>العضو</th><th>الجهاز</th><th>الوظيفة</th></tr>
                        </thead>
                        <tbody id="tableBody">
                            <!-- سيتم تعبئته بواسطة JavaScript -->
                        </tbody>
                    </table>
                </div>
                <!-- شريط التنقل (Pagination) -->
                <div id="paginationControls" class="d-flex justify-content-center mt-3 gap-2"></div>
            </div>
        </div>
        <div class="col-lg-5">
            <div class="lab-card shadow">
                <h3 class="text-info mb-4">⚖️ حاسبة BMI</h3>
                <div class="mb-3"><label class="form-label small">الوزن (كجم)</label><input type="number" id="weight" class="form-control bg-dark text-white"></div>
                <div class="mb-3"><label class="form-label small">الطول (سم)</label><input type="number" id="height" class="form-control bg-dark text-white"></div>
                <button class="btn btn-info w-100 fw-bold rounded-pill" onclick="calculateBMI()">احسب</button>
                <div id="bmiResult" class="calc-result"><h5>النتيجة: <span id="bmiValue"></span></h5><p id="bmiStatus"></p></div>
            </div>
        </div>
    </div>

    <!-- ========= 2. لوحة تقدم الأجهزة (بدون تغيير) ========= -->
    <h3 class="text-info mb-4">📊 تقدمي في أجهزة الجسم</h3>
    <div class="row g-4" id="systemsProgressContainer"></div>
</main>

<script>
    // --------------------- الأجهزة المعروفة (للتقدم) ---------------------
    const SYSTEMS = [
        { id: 'skeletal', name: 'الهيكل العظمي', page: 'skeletal.html' },
        { id: 'muscular', name: 'الجهاز العضلي', page: 'muscular.html' },
        { id: 'circulatory', name: 'الجهاز الدوري', page: 'circulatory.html' },
        { id: 'digestive', name: 'الجهاز الهضمي', page: 'digestive.html' },
        { id: 'nervous', name: 'الجهاز العصبي', page: 'nervous.html' }
    ];

    // أسماء الأعضاء العربية (للملاحظات) - نفس السابق
    const organNames = { /* ... كما هو موجود ... */ };

    // دوال التقدم (نفسها من lab.html السابق)
    function getTotalOrgans(systemId) { ... }
    function getStudiedOrgans(systemId) { ... }
    function getNotesForSystem(systemId, organIdList) { ... }
    function renderProgressCards() { ... }
    async function exportSystemPDF(systemId) { ... }
    function goToQuiz(systemId) { window.location.href = `quiz-setup.html?system=${systemId}`; }

    // --------------------- قاموس الأجزاء مع Pagination ---------------------
    let allOrgans = [];           // القائمة الكاملة (مصفوفة)
    let filteredOrgans = [];      // القائمة بعد التصفية (إن وُجد بحث)
    let currentPage = 1;
    const rowsPerPage = 5;
    let totalPages = 1;

    // تحميل جميع الأعضاء من localStorage (مفاتيح organsList_*)
    function loadAllOrgansFromStorage() {
        let organs = [];
        for (let sys of SYSTEMS) {
            let key = `organsList_${sys.id}`;
            let stored = localStorage.getItem(key);
            if (stored) {
                let list = JSON.parse(stored);
                for (let organ of list) {
                    organs.push({
                        name: organ.name,
                        system: sys.id,
                        systemName: sys.name,
                        function: (organ.details || '').substring(0, 100) + ((organ.details || '').length > 100 ? '...' : '')
                    });
                }
            }
        }
        // إذا لم يتم العثور على أي أعضاء (لم تُزر صفحات الأجهزة بعد) نستخدم بيانات افتراضية
        if (organs.length === 0) {
            organs = [
                { name: "الجمجمة", system: "skeletal", systemName: "الهيكل العظمي", function: "حماية الدماغ" },
                { name: "القلب", system: "circulatory", systemName: "الجهاز الدوري", function: "ضخ الدم" },
                { name: "المعدة", system: "digestive", systemName: "الجهاز الهضمي", function: "هضم الطعام" },
                { name: "العضلة الصدرية", system: "muscular", systemName: "الجهاز العضلي", function: "حركة الذراع" },
                { name: "الدماغ", system: "nervous", systemName: "الجهاز العصبي", function: "التحكم بالجسم" }
            ];
        }
        return organs;
    }

    // عرض الجدول بناءً على الصفحة الحالية (من filteredOrgans)
    function renderTable() {
        const tbody = document.getElementById('tableBody');
        if (!tbody) return;
        tbody.innerHTML = '';
        const start = (currentPage - 1) * rowsPerPage;
        const end = start + rowsPerPage;
        const pageData = filteredOrgans.slice(start, end);
        
        for (let organ of pageData) {
            const row = tbody.insertRow();
            row.setAttribute('data-system', organ.system);
            row.classList.add('clickable-row');
            row.addEventListener('click', () => {
                window.location.href = `${organ.system}.html`;
            });
            row.insertCell(0).innerText = organ.name;
            row.insertCell(1).innerText = organ.systemName;
            row.insertCell(2).innerText = organ.function;
        }
        
        // تحديث أزرار التنقل
        setupPaginationButtons();
    }

    // إنشاء أزرار التنقل (السابق، التالي، وأرقام الصفحات)
    function setupPaginationButtons() {
        const container = document.getElementById('paginationControls');
        if (!container) return;
        container.innerHTML = '';
        
        totalPages = Math.ceil(filteredOrgans.length / rowsPerPage);
        if (totalPages <= 1) return;
        
        // زر السابق
        const prevBtn = document.createElement('button');
        prevBtn.className = 'btn btn-outline-info btn-sm';
        prevBtn.innerText = '‹ السابق';
        prevBtn.disabled = (currentPage === 1);
        prevBtn.onclick = () => { if (currentPage > 1) { currentPage--; renderTable(); } };
        container.appendChild(prevBtn);
        
        // أرقام الصفحات (عرض 5 أرقام كحد أقصى)
        let startPage = Math.max(1, currentPage - 2);
        let endPage = Math.min(totalPages, startPage + 4);
        for (let i = startPage; i <= endPage; i++) {
            const pageBtn = document.createElement('button');
            pageBtn.className = `btn btn-sm ${i === currentPage ? 'btn-info' : 'btn-outline-secondary'}`;
            pageBtn.innerText = i;
            pageBtn.onclick = () => { currentPage = i; renderTable(); };
            container.appendChild(pageBtn);
        }
        
        // زر التالي
        const nextBtn = document.createElement('button');
        nextBtn.className = 'btn btn-outline-info btn-sm';
        nextBtn.innerText = 'التالي ›';
        nextBtn.disabled = (currentPage === totalPages);
        nextBtn.onclick = () => { if (currentPage < totalPages) { currentPage++; renderTable(); } };
        container.appendChild(nextBtn);
    }

    // فلترة الجدول بناءً على نص البحث (يبحث في الاسم بالكامل)
    function filterTable() {
        const searchTerm = document.getElementById('anatomySearch').value.trim().toUpperCase();
        if (searchTerm === "") {
            filteredOrgans = [...allOrgans];
        } else {
            filteredOrgans = allOrgans.filter(organ => organ.name.toUpperCase().includes(searchTerm));
        }
        currentPage = 1;
        renderTable();
    }

    // دالة BMI (بدون تغيير)
    function calculateBMI() {
        let w = parseFloat(document.getElementById('weight').value);
        let h = parseFloat(document.getElementById('height').value) / 100;
        if (w > 0 && h > 0) {
            let bmi = (w / (h * h)).toFixed(1);
            document.getElementById('bmiValue').innerText = bmi;
            let status = "";
            if (bmi < 18.5) status = "نقص وزن";
            else if (bmi < 25) status = "وزن طبيعي";
            else if (bmi < 30) status = "زيادة وزن";
            else status = "سمنة";
            document.getElementById('bmiStatus').innerText = status;
            document.getElementById('bmiResult').style.display = "block";
        } else alert("أدخل قيماً صحيحة");
    }

    // --------------------- تحميل الصفحة ---------------------
    document.getElementById('anatomySearch').addEventListener('keyup', filterTable);
    
    // تحميل جميع الأعضاء من localStorage وإعداد الجدول
    allOrgans = loadAllOrgansFromStorage();
    filteredOrgans = [...allOrgans];
    renderTable();
    
    // تحميل بطاقات التقدم (نفس الكود السابق)
    renderProgressCards();
    // تحديث بطاقات التقدم كل 2 ثانية (لمواكبة التغييرات)
    setInterval(() => renderProgressCards(), 2000);
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<footer class="text-center text-secondary py-5 border-top">
    <p>© 2026 ANATOMY ATLAS || SCIENCE TEAM</p>
</footer>
</body>
</html>
