<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إنشاء حساب - Anatomy 3D</title>
    <link rel="stylesheet" href="auth-style.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="auth-card reverse">
        <div class="form-side">
            <img src="Logo.png" class="logo" alt="Logo">
            <h1>إنشاء حساب</h1>
            <div class="google-btn">
                <img src="logo-google-svgrepo-com.svg" alt="G">
                <span>التسجيل عبر جوجل</span>
            </div>
            <p class="separator">أو استخدم بريدك الإلكتروني</p>
            <form action="https://httpbin.org/get" method="get">
                <input type="text" placeholder="الاسم الكامل" required>
                <input type="email" placeholder="البريد الإلكتروني" required>
                <input type="password" placeholder="كلمة المرور" required>
                <button type="submit" class="submit-btn">الإنضمام الآن</button>
            </form>
        </div>

        <div class="image-side side-bg">
            <div class="overlay-content">
                <h2>مرحباً بك!</h2>
                <p>أدخل بياناتك الشخصية وابدأ استكشاف التطبيق</p>
                <a href="login.html" class="switch-btn">تسجيل الدخول</a>
            </div>
        </div>
    </div>

        <script>
        // Light JS validation for signup form
        document.getElementById('signupForm').addEventListener('submit', function(e) {
            let isValid = true;

            // Name: required, only letters and spaces
            let name = document.getElementById('fullname').value.trim();
            let nameErr = document.getElementById('nameError');
            if (name === '') {
                nameErr.innerText = '✖ Full name is required';
                isValid = false;
            } else if (!/^[a-zA-Z\u0600-\u06FF\s]+$/.test(name)) {
                nameErr.innerText = '✖ Only letters and spaces allowed';
                isValid = false;
            } else {
                nameErr.innerText = '';
            }

            // Email: required, must end with .com or .edu
            let email = document.getElementById('email').value.trim();
            let emailErr = document.getElementById('emailError');
            let emailPattern = /^[^\s@]+@[^\s@]+\.(com|edu)$/i;
            if (email === '') {
                emailErr.innerText = '✖ Email is required';
                isValid = false;
            } else if (!emailPattern.test(email)) {
                emailErr.innerText = '✖ Email must end with .com or .edu';
                isValid = false;
            } else {
                emailErr.innerText = '';
            }

            // Password: min 8 chars, at least one uppercase and one digit
            let pass = document.getElementById('password').value;
            let passErr = document.getElementById('passError');
            let passPattern = /^(?=.*[A-Z])(?=.*\d).{8,}$/;
            if (pass === '') {
                passErr.innerText = '✖ Password is required';
                isValid = false;
            } else if (!passPattern.test(pass)) {
                passErr.innerText = '✖ 8+ chars, 1 uppercase & 1 digit';
                isValid = false;
            } else {
                passErr.innerText = '';
            }

            // Confirm password match
            let confirm = document.getElementById('confirm_password').value;
            let confirmErr = document.getElementById('confirmError');
            if (confirm !== pass) {
                confirmErr.innerText = '✖ Passwords do not match';
                isValid = false;
            } else {
                confirmErr.innerText = '';
            }

            if (!isValid) {
                e.preventDefault();  // stop submission if errors
            }
        });
    </script>
</body>
</html>
