<style>
.form-card {
    background: #000;
    border-radius: 20px;
    padding: 30px;
    border: 1px solid #1e293b;
    box-shadow: 0 0 20px rgba(0,212,255,0.15);
    max-width: 700px;
    margin: auto;
}


.form-label-custom {
    color: #cbd5e1;
    font-size: 0.9rem;
    margin-bottom: 6px;
    display: block;
}

.form-control-custom {
    width: 100%;
    padding: 12px;
    background: #161f2e;
    border: 1px solid #1e293b;
    border-radius: 10px;
    color: white;
    outline: none;
}

.form-control-custom:focus {
    border-color: #00d4ff;
}

.form-check-custom {
    margin-left: 15px;
    color: #e2e8f0;
    font-size: 0.9rem;
}

.range-container {
    display: flex;
    align-items: center;
    gap: 10px;
}

.range-value {
    width: 60px;
    text-align: center;
    background: #161f2e;
    border: 1px solid #1e293b;
    border-radius: 8px;
    color: white;
}

input[type="range"] {
    flex: 1;
    appearance: none;
    height: 6px;
    background: #00d4ff;
    border-radius: 10px;
}

input[type="range"]::-webkit-slider-thumb {
    appearance: none;
    width: 16px;
    height: 16px;
    background: #00d4ff;
    border-radius: 50%;
    cursor: pointer;
}

.submit-btn {
    width: 100%;
    padding: 14px;
    background: #00d4ff;
    color: black;
    border: none;
    border-radius: 25px;
    font-weight: bold;
    margin-top: 15px;
    transition: 0.3s;
}

.submit-btn:hover {
    transform: scale(1.03);
}

.custom-range-wrapper {
    position: relative;
    width: 100%;
    height: 8px;
    background: #1e293b;
    border-radius: 10px;
    overflow: hidden;
}

.range-fill {
    position: absolute;
    height: 100%;
    width: 50%;
    background: #00d4ff;
    border-radius: 10px;
    transition: width 0.1s linear;
    box-shadow: 0 0 10px #00d4ff;
}

.custom-range-wrapper input[type="range"] {
    position: absolute;
    width: 100%;
    height: 100%;
    opacity: 0;
    cursor: pointer;
}

.range-value {
    width: 80px;
    text-align: center;
    background: #161f2e;
    border: 1px solid #1e293b;
    border-radius: 8px;
    color: white;
}

</style>
</head>

<div class="container">

    <h1 style="color:#00d4ff;">استبيان رأي المستخدمين</h1>
    <p style="color: var(--sub-text); margin-bottom: 30px;">
        ساعدنا في تحسين تجربة التعلم الخاصة بك
    </p>

    <div class="form-card">
        <form id="form" action="insert.php" method="POST">

            <label class="form-label-custom">الاسم الكامل *</label>
            <input type="text" id="name" name="name" class="form-control-custom">

            <label class="form-label-custom mt-3">مستوى الدراسة *</label>
            <div class="d-flex flex-wrap gap-3 justify-content-center text-center w-100">
                <label class="form-check-custom">
                    <input type="radio" name="level" value="طالب بكالوريوس"> طالب بكالوريوس
                </label>

                <label class="form-check-custom">
                    <input type="radio" name="level" value="طالب ماجستير"> طالب ماجستير
                </label>

                <label class="form-check-custom">
                    <input type="radio" name="level" value="طالب مدرسة"> طالب مدرسة
                </label>

                <label class="form-check-custom">
                    <input type="radio" name="level" value="أستاذ/باحث"> أستاذ/باحث
                </label>
            </div>

            <label class="form-label-custom mt-3">الأنظمة التشريحية</label>
            <div class="d-flex flex-wrap gap-3 justify-content-center text-center w-100">
                <label class="form-check-custom">
                    <input type="checkbox" name="systems[]" value="الهيكل العظمي"> الهيكل العظمي
                </label>

                <label class="form-check-custom">
                    <input type="checkbox" name="systems[]" value="الجهاز العضلي"> الجهاز العضلي
                </label>

                <label class="form-check-custom">
                    <input type="checkbox" name="systems[]" value="الجهاز الدوري"> الجهاز الدوري
                </label>

                <label class="form-check-custom">
                    <input type="checkbox" name="systems[]" value="الجهاز العصبي"> الجهاز العصبي
                </label>
            </div>

            <label class="form-label-custom mt-3">تقييمك (1-10) *</label>

            <div class="range-container">
                <input type="number" id="num" name="rating" class="range-value" value="5" min="1" max="10">
                
                <div class="custom-range-wrapper">
                    <div class="range-fill" id="rangeFill"></div>
                    <input type="number" id="num" name="rating" class="range-value" value="5" min="1" max="10">
                </div>
            </div>

            <label class="form-label-custom mt-3">اقتراحاتك</label>
            <textarea name="suggestion" class="form-control-custom" rows="3"></textarea>

            <button type="submit" class="submit-btn">إرسال الاستبيان</button>

        </form>
    </div>

</div>

<div class="footer">
    <p>© 2026 Anatomy Atlas || Science Team</p>
</div>

<script>
const range = document.getElementById("range");
const num = document.getElementById("num");
const fill = document.getElementById("rangeFill");

function updateFill(value) {
    const percent = ((value - 1) / 9) * 100;
    fill.style.width = percent + "%";
}

range.addEventListener("input", () => {
    num.value = range.value;
    updateFill(range.value);
});

num.addEventListener("input", () => {
    let val = Math.max(1, Math.min(10, num.value));
    range.value = val;
    num.value = val;
    updateFill(val);
});

updateFill(range.value);


document.getElementById("form").addEventListener("submit", function(e) {

    let valid = true;

    // reset errors
    document.querySelectorAll(".error").forEach(el => el.remove());

    // name
    let name = document.querySelector("input[name='name']");
    if(name.value.trim().length < 3){
        showError(name, "الاسم يجب أن يكون 3 أحرف على الأقل");
        valid = false;
    }

    // level (radio)
    let level = document.querySelector("input[name='level']:checked");
    if(!level){
        showGroupError("level", "اختر مستوى الدراسة");
        valid = false;
    }

    // checkbox systems
    let systems = document.querySelectorAll("input[name='systems[]']:checked");
    if(systems.length === 0){
        showGroupError("systems", "اختر نظام واحد على الأقل");
        valid = false;
    }

    // rating
    let rating = document.querySelector("input[name='rating']");
    if(rating.value < 1 || rating.value > 10){
        showError(rating, "التقييم يجب أن يكون بين 1 و 10");
        valid = false;
    }

    // suggestion (optional limit)
    let suggestion = document.querySelector("textarea[name='suggestion']");
    if(suggestion.value.length > 200){
        showError(suggestion, "الاقتراح لا يجب أن يتجاوز 200 حرف");
        valid = false;
    }

    if(!valid){
        e.preventDefault();
    }

});

// error under input
function showError(input, message){
    let err = document.createElement("div");
    err.className = "error";
    err.style.color = "red";
    err.style.fontSize = "12px";
    err.innerText = message;
    input.parentNode.appendChild(err);
}

// error for groups
function showGroupError(group, message){
    let err = document.createElement("div");
    err.className = "error";
    err.style.color = "red";
    err.style.fontSize = "12px";

    let ref;

    if(group === "level"){
        ref = document.querySelector("input[name='level']").parentNode;
    }

    if(group === "systems"){
        ref = document.querySelector("input[name='systems[]']").parentNode;
    }

    err.innerText = message;
    ref.appendChild(err);
}
</script>
